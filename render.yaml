# Render Blueprint for Chapterly
# Provisions a PostgreSQL database, the Express API, and the Vite static frontend.
# Docs: https://render.com/docs/blueprint-spec
#
# After the first deploy:
#   1. Fill in the API keys marked "sync: false" in the Render dashboard
#      (Cloudinary / OpenAI / Unsplash) for the chapterly-api service.
#   2. Set VITE_API_URL on chapterly-web to the API's public URL + /api,
#      e.g. https://chapterly-api.onrender.com/api, then redeploy the frontend.

databases:
  - name: chapterly-db
    databaseName: chapterly
    user: chapterly
    plan: free

services:
  # ---- Backend: Express API ----
  - type: web
    name: chapterly-api
    runtime: node
    plan: free
    rootDir: backend
    # node-pg-migrate is a devDependency, so use a plain install (not --production).
    buildCommand: npm install && npm run migrate
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: chapterly-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: OPENAI_MODEL
        value: gpt-4o-mini
      # Secrets — set these in the Render dashboard after the first deploy.
      - key: CLOUDINARY_CLOUD_NAME
        sync: false
      - key: CLOUDINARY_API_KEY
        sync: false
      - key: CLOUDINARY_API_SECRET
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: UNSPLASH_ACCESS_KEY
        sync: false

  # ---- Frontend: Vite static site ----
  - type: web
    name: chapterly-web
    runtime: static
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    # SPA fallback so client-side routes resolve to index.html.
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      # Point the client at the deployed API (include the /api suffix).
      - key: VITE_API_URL
        sync: false
